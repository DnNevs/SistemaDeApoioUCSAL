<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Memorial de Cálculo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .container {
            flex: 1; /* ocupa todo espaço restante */
            padding: 10px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <header>
        📊 Memorial de Cálculo
    </header>

    <div class="container">
        <iframe src="https://dashboardsad.lovable.app"></iframe>
    </div>
</body>
</html>
